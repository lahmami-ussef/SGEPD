server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - PreserveHostHeader # Aide à garder la connexion stable

            - id: user-service
              uri: http://127.0.0.1:8085
              predicates:
                - Path=/api/users/**
              filters:
                - name: AuthenticationFilter

            - id: screen-service
              uri: http://127.0.0.1:8082
              predicates:
                - Path=/api/screens/**
              filters:
                - name: AuthenticationFilter

            - id: client-service
              uri: http://127.0.0.1:8083
              predicates:
                - Path=/api/clients/**
              filters:
                - name: AuthenticationFilter

            - id: ticket-service
              uri: http://127.0.0.1:8084
              predicates:
                - Path=/api/tickets/**
              filters:
                - name: AuthenticationFilter

            - id: location-service
              uri: http://127.0.0.1:8088
              predicates:
                - Path=/api/locations/**
              filters:
                - name: AuthenticationFilter

