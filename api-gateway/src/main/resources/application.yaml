server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=Cookie
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - PreserveHostHeader

            - id: user-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/users/**
              filters:
                - name: AuthenticationFilter

            - id: screen-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/screens/**
              filters:
                - name: AuthenticationFilter

            - id: client-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/clients/**
              filters:
                - name: AuthenticationFilter

            - id: ticket-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/tickets/**
              filters:
                - name: AuthenticationFilter

            - id: location-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/locations/**
              filters:
                - name: AuthenticationFilter

            - id: dashboard-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/dashboard/**
              filters:
                - name: AuthenticationFilter

            - id: assignment-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/assignments/**
              filters:
                - name: AuthenticationFilter

app:
  jwt:
