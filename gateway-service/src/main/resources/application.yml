server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/api/auth/**
          filters:
            - PreserveHostHeader

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: AuthenticationFilter

        - id: screen-service
          uri: http://screen-service:8082
          predicates:
            - Path=/api/screens/**
          filters:
            - name: AuthenticationFilter

        - id: client-service
          uri: http://client-service:8086
          predicates:
            - Path=/api/clients/**
          filters:
            - name: AuthenticationFilter

        - id: ticket-service
          uri: http://ticket-service:8083
          predicates:
            - Path=/api/tickets/**
          filters:
            - name: AuthenticationFilter

        - id: assignment-service
          uri: http://assignment-service:8084
          predicates:
            - Path=/api/assignments/**
          filters:
            - name: AuthenticationFilter

        - id: dashboard-service
          uri: http://dashboard-service:8085
          predicates:
            - Path=/api/dashboard/**
          filters:
            - name: AuthenticationFilter

        - id: location-service
          uri: http://location-service:8088
          predicates:
            - Path=/api/locations/**
          filters:
            - name: AuthenticationFilter

