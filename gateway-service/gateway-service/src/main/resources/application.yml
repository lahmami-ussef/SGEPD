server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # Route 1: Auth Service (Port 8080)
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/auth/**

        # Route 2: User Service (Port 8081)
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        # Route 3: Screen Service (Port 8082)
        - id: screen-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/screens/**

        # Route 4: Ticket Service (Port 8083)
        - id: ticket-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/tickets/**

        # Route 5: Client Service (Port 8083)
        - id: client-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/clients/**

        # Route 6: Assignment Service (Port 8084)
        - id: assignment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/assignments/**

        # Route 7: Dashboard Service (Port 8085)
        - id: dashboard-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/dashboard/**

        # Route 8: Location Service (Port 8088)
        - id: location-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/locations/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE
