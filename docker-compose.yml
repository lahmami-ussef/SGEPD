version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: sgepd-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mouad3at3at
    ports:
      - "5433:5432"
    volumes:
      - sgepd-db-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  redis:
    image: redis:latest
    container_name: sgepd-redis
    ports:
      - "6379:6379"

volumes:
  sgepd-db-data:
